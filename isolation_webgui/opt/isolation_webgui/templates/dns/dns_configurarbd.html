<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title data-i18n="db_config">Configuración de Base de Datos</title>
		<link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
		<style type="text/css">
			/* Estilos básicos para las pestañas */
			body {
				font-family: Arial, sans-serif;
				padding: 20px;
				background-color: #f4f4f9;
			}
			
			.tabs {
				display: flex;
				cursor: pointer;
				background-color: #ddd;
				padding: 10px;
				border-radius: 5px 5px 0 0;
			}
			
			.tab {
				padding: 10px 20px;
				margin-right: 5px;
				background-color: #ccc;
				border-radius: 5px;
				transition: background-color 0.3s;
			}
			
			.tab:hover {
				background-color: #bbb;
			}
			
			.tab.active {
				background-color: #3498db;
				color: white;
			}
			
			/* Contenido de las pestañas */
			.tab-content {
				display: none;
				padding: 20px;
				background-color: white;
				border: 1px solid #ddd;
				border-top: none;
				border-radius: 0 0 5px 5px;
				margin-top: 10px;
			}

			.tab-content.active {
				display: block;
			}

			.form-group {
				margin-bottom: 15px;
			}

			.form-label {
				font-weight: bold;
			}

			input[type="text"] {
				width: 100%;
				padding: 8px;
				margin-top: 5px;
				border-radius: 4px;
				border: 1px solid #ccc;
			}

			button {
				padding: 10px 15px;
				background-color: #3498db;
				color: white;
				border: none;
				border-radius: 5px;
				cursor: pointer;
			}

			button:hover {
				background-color: #2980b9;
			}
		</style>
		<link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
		<script type="text/javascript" src="{{ url_for('static', filename='js/flash_alert.js') }}"></script>
		<script type="text/javascript">
			document.addEventListener("DOMContentLoaded", () => {
				I18N.init("dns");
			});
		</script>
		<script type="text/javascript" src="{{ url_for('static', filename='js/i18n.js') }}"></script>

	</head>
	<body>
		<select id="langSwitcher">
			<option value="es">🇪🇸 Español</option>
			<option value="eu">🇵🇲 Euskara</option>
			<option value="en">🇬🇧 English</option>
			<option value="fr">🇫🇷 Français</option>
			<option value="uk">🇺🇦 Українська</option>
			<option value="tr">🇹🇷 Türkçe</option>
			<option value="ja">🇯🇵 日本語</option>
			<option value="zh-cn">🇨🇳 简体中文</option>
			<option value="zh-tw">🇨🇳 繁體中文</option>
		</select>

	<div class="container">
		<h2 data-i18n="db_config">Configuración de Base de Datos</h2>
		<div class="menu" role="navigation">
			<a class="pages" href="{{ url_for('panel.panel_home') }}">Panel</a>
			<a class="pages" href="{{ url_for('dns.vaciar_config') }}" data-i18n="empty_db">Vaciar Base de Datos</a>
			<a class="pages" href="{{ url_for('dns.zona_directa_dns') }}" data-i18n="direct_zone">Configurar Zona Directa</a>
			<a class="pages" href="{{ url_for('dns.zona_inversa_dns') }}" data-i18n="reverse_zone">Configurar Zona Inversa</a>
			<a class="pages active" href="{{ url_for('dns.configurar_bd_dns') }}" data-i18n="db_config">Configurar Bases de Datos</a>
			<a class="pages" href="{{ url_for('dns.asignar_registros_dns') }}" data-i18n="add_record">Añadir Registro</a>
		</div>

		<form method="POST">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

			<!-- Pestañas -->
			<div class="tabs">
				<div class="tab active" id="tab-bdname">Base de Datos</div>
				<div class="tab" id="tab-config">Configuración</div>
				<div class="tab" id="tab-nameserver">Nameserver</div>
				<div class="tab" id="tab-ip">IP de la Zona</div>
			</div>

			<!-- Contenido de las pestañas -->
			<div class="tab-content active" id="content-bdname">
				<div class="form-group">
					<label for="bdname" class="form-label" data-i18n="db_name">Nombre de la Base de Datos *</label>
					<input type="text" id="bdname" name="bdname" required/>
				</div>
			</div>

			<div class="tab-content" id="content-config">
				<div class="form-group">
					<label for="MNAME" class="form-label" data-i18n="mname">Nombre Maestro (FQDN con punto final) *</label>
					<input type="text" id="MNAME" name="MNAME"/>
				</div>
				<div class="form-group">
					<label for="contact" class="form-label" data-i18n="contact">Contacto *</label>
					<input type="text" id="contact" name="contact"/>
				</div>
				<div class="form-group">
					<label for="TTL" class="form-label" data-i18n="ttl">TTL por defecto (opcional)</label>
					<input type="text" id="TTL" name="TTL"/>
				</div>
				<div class="form-group">
					<label for="serial" class="form-label" data-i18n="serial">Serial (opcional)</label>
					<input type="text" id="serial" name="serial"/>
				</div>
				<div class="form-group">
					<label for="refresh" class="form-label" data-i18n="refresh">Refresh (opcional)</label>
					<input type="text" id="refresh" name="refresh"/>
				</div>
				<div class="form-group">
					<label for="retry" class="form-label" data-i18n="retry">Retry (opcional)</label>
					<input type="text" id="retry" name="retry"/>
				</div>
				<div class="form-group">
					<label for="expire" class="form-label" data-i18n="expire">Expire (opcional)</label>
					<input type="text" id="expire" name="expire"/>
				</div>
				<div class="form-group">
					<label for="negativeCacheTTL" class="form-label" data-i18n="negativeCacheTTL">Negative Cache TTL (opcional)</label>
					<input type="text" id="negativeCacheTTL" name="negativeCacheTTL"/>
				</div>
			</div>

			<div class="tab-content" id="content-nameserver">
				<div class="form-group">
					<label for="nameserver" class="form-label" data-i18n="nameserver">Nameserver autoritativo *</label>
					<input type="text" id="nameserver" name="nameserver"/>
				</div>
			</div>
			
			<div class="tab-content" id="content-ip">
				<div class="form-group">
					<label for="dirIP" class="form-label" data-i18n="ip_zone">Dirección IP de la zona (opcional)</label>
					<input type="text" id="dirIP" name="dirIP" data-ip/>
				</div>
			</div>

			<button type="submit" data-i18n="submit_btn">Enviar</button>
		</form>
	</div>

	<script type="text/javascript">
		// Cambiar las pestañas
		document.querySelectorAll('.tab').forEach(tab => {
			tab.addEventListener('click', function() {
				// Eliminar la clase 'active'
				document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
				document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
				
				// Agregar la clase 'active'
				tab.classList.add('active');
				document.getElementById('content-' + tab.id.split('-')[1]).classList.add('active');
			});
		});
	</script>
	<script type="text/javascript" src="{{ url_for('static', filename='js/regexconf.js') }}"></script>

	</body>
</html>
