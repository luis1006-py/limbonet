<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<title>Conversión de Dirección de Red a in-addr.arpa</title>
			<link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
		<script type="text/javascript">
		function convertirInAddrArpa() {
				let red = document.getElementById("red").value.trim().replace(/\.$/, "");
				let octs = red.split(".");

				if (octs.length >= 1 && octs.length <= 4 && octs.every(o => /^\d+$/.test(o) && o >= 0 && o <= 255)) {
					let reversed_ip = octs.reverse().join(".") + ".in-addr.arpa";
					document.getElementById("in_addr_arpa").value = reversed_ip;
				} else {
					document.getElementById("in_addr_arpa").value = "";
				}
			}
		</script>
		<link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
		<script type="text/javascript">
			document.addEventListener("DOMContentLoaded", () => {
				I18N.init("dns");
			});
		</script>
		<script type="text/javascript" src="{{ url_for('static', filename='js/i18n.js') }}"></script>

	</head>
	<body>
		<select id="langSwitcher">
		<option value="es">🇪🇸 Español</option>
		<option value="eu">🇵🇲 Euskara</option>
		<option value="en">🇬🇧 English</option>
		<option value="fr">🇫🇷 Français</option>
		<option value="uk">🇺🇦 Українська</option>
		<option value="tr">🇹🇷 Türkçe</option>
		<option value="ja">🇯🇵 日本語</option>
		<option value="zh-cn">🇨🇳 简体中文</option>
		<option value="zh-tw">🇨🇳 繁體中文</option>
	</select>
		<div class="menu" role="navigation">
			<a class="pages" href="{{ url_for('panel.panel_home') }}">Panel</a>
			<a class="pages" href="{{ url_for('dns.vaciar_config') }}" data-i18n="empty_db">Vaciar Base de Datos</a>
			<a class="pages" href="{{ url_for('dns.zona_directa_dns') }}" data-i18n="direct_zone">Configurar Zona Directa</a>
			<a class="pages active" href="{{ url_for('dns.zona_inversa_dns') }}" data-i18n="reverse_zone">Configurar Zona Inversa</a>
			<a class="pages" href="{{ url_for('dns.configurar_bd_dns') }}" data-i18n="db_config">Configurar Bases de Datos</a>
		</div>
		<h2 data-i18n="reverse_zone">Configuración de zona inversa</h2>

		<form method="POST">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
			<label for="red"><span data-i18n="inverse_name">Introduce la dirección de red</span> (192.168.1) *</label><br>
			<input type="text" id="red" name="red" oninput="convertirInAddrArpa()" pattern="^(25[0-5]|2[0-4]?\d|1?\d?\d)(\.(25[0-5]|2[0-4]?\d|1?\d?\d)){0,3}$" laceholder="192.168.1" required><br>

			<label for="in_addr_arpa" data-i18n="in_addr_arpa">Dirección in-addr.arpa (solo lectura)</label><br>
			<input type="text" id="in_addr_arpa" name="in_addr_arpa" readonly><br>

			<label for="db" data-i18n="db_name">Nombre de la Base de Datos: *</label><br>
			<input type="text" id="db" name="db" required><br><br>

			<button type="submit" data-i18n="submit_btn">Enviar</button>
		</form>
		<script type="text/javascript" src="{{ url_for('static', filename='js/flash_alert.js') }}"></script>
		<script type="text/javascript" src="{{ url_for('static', filename='js/regexconf.js') }}"></script>
	</body>
</html>
