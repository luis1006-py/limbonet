<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Formulario de Configuración de Zona Directa</title>
		<link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">

	<script type="text/javascript" src="{{ url_for('static', filename='js/flash_alert.js') }}"></script>
	<script type="text/javascript">
		document.addEventListener("DOMContentLoaded", () => {
			I18N.init("dns");
		});
	</script>
	<script type="text/javascript" src="{{ url_for('static', filename='js/i18n.js') }}"></script>

	</head>
<body>
	<select id="langSwitcher">
		<option value="es">🇪🇸 Español</option>
		<option value="eu">🇵🇲 Euskara</option>
		<option value="en">🇬🇧 English</option>
		<option value="fr">🇫🇷 Français</option>
		<option value="uk">🇺🇦 Українська</option>
		<option value="tr">🇹🇷 Türkçe</option>
		<option value="ja">🇯🇵 日本語</option>
		<option value="zh-cn">🇨🇳 简体中文</option>
		<option value="zh-tw">🇨🇳 繁體中文</option>
	</select>
	<div class="menu" role="navigation">
		<a class="pages" href="{{ url_for('panel.panel_home') }}">Panel</a>
		<a class="pages" href="{{ url_for('dns.vaciar_config') }}" data-i18n="empty_db">Vaciar Base de Datos</a>
		<a class="pages active" href="{{ url_for('dns.zona_directa_dns') }}" data-i18n="direct_zone">Configurar Zona Directa</a>
		<a class="pages" href="{{ url_for('dns.zona_inversa_dns') }}" data-i18n="reverse_zone">Configurar Zona Inversa</a>
		<a class="pages" href="{{ url_for('dns.configurar_bd_dns') }}" data-i18n="db_config">Configurar Bases de Datos</a>
		<a class="pages" href="{{ url_for('dns.asignar_registros_dns') }}" data-i18n="add_record">Añadir Registro</a>
	</div>
	<form method="POST">
		<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
		<h2 data-i18n="direct_zone">Configuración de Zona Directa</h2>

		<label for="name" data-i18n="direct_name">Nombre de la zona directa *</label>
		<input type="text" id="name" name="name" required/><br/>

		<label for="db" data-i18n="db_name">Nombre de la base de datos *</label>
		<input type="text" id="db" name="db" required/><br/>

		<input type="submit" value="Enviar" data-i18n="submit_btn"/>
	</form>
</body>
</html>
