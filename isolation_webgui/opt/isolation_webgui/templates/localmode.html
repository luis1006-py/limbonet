<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Activar modo local</title>
		<link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
		<link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">

		<script type="text/javascript" src="{{ url_for('static', filename='js/flash_alert.js') }}"></script>
		<script type="text/javascript">
			document.addEventListener("DOMContentLoaded", () => {
				I18N.init("home");
			});
		</script>
		<script type="text/javascript" src="{{ url_for('static', filename='js/i18n.js') }}"></script>

	</head>
	<body>
		<select id="langSwitcher">
			<option value="es">🇪🇸 Español</option>
			<option value="eu">🇵🇲 Euskara</option>
			<option value="en">🇬🇧 English</option>
			<option value="fr">🇫🇷 Français</option>
			<option value="uk">🇺🇦 Українська</option>
			<option value="tr">🇹🇷 Türkçe</option>
			<option value="ja">🇯🇵 日本語</option>
			<option value="zh-cn">🇨🇳 简体中文</option>
			<option value="zh-tw">🇨🇳 繁體中文</option>
		</select>
		<div class="menu" role="navigation">
			<a class="pages" href="{{ url_for('panel.panel_home') }}">Panel</a>
			<a class="pages" data-i18n="dns_config" href="{{ url_for('dns.dns_home') }}">Configuración DNS</a>
			<a class="pages" data-i18n="dhcp_config" href="{{ url_for('dhcp.dhcp_home') }}">Configuración DHCP</a>
			<a class="pages" data-i18n="netplan_config" href="{{ url_for('netplan.netplan_home') }}">Configuración Netplan</a>
			<a class="pages" data-i18n="apply_changes" href="{{ url_for('panel.send_data') }}">Aplicar cambios</a>
			<a class="pages" data-i18n="change_pwd" href="{{ url_for('panel.change_password') }}">Cambiar contraseña</a>
			<a class="pages" data-i18n="logout" href="{{ url_for('auth.logout') }}">Cerrar sesión</a>
		</div>

		<h1>Warning</h1>
		<p data-i18n="warnmsg">
			Si activas el modo local, se guardará este equipo en la base de datos y deberá ser borrado manualmente. Podrás seguir agregando otros servidores.
		</p>
		<form action="/confirmlocal" method="post">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
			<button type="submit">OK</button>
		</form>

	</body>
</html>
